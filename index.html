<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>可視化 · Audio Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --ink:#dcdcdc; --dim:#777; --line:#333; --accent:#c9577a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center;
         font-family:DotGothic16,"MS Gothic",Consolas,monospace; color:var(--ink); }
  canvas { display:block; }
  body.drag canvas { outline:2px dashed var(--accent); outline-offset:-10px; }

  button,input,select { font:inherit; color:inherit; }
  button,select { background:#161616; border:1px solid var(--line); padding:5px 10px; cursor:pointer; }
  button:hover,select:hover { border-color:var(--accent); }
  button.on { border-color:var(--accent); color:#fff; background:#3a1622; }
  input[type=text],input[type=number] { background:#0c0c0c; border:1px solid var(--line); padding:5px 8px; width:120px; }
  input:focus,select:focus,button:focus-visible { outline:1px solid var(--accent); }
  input[type=range] { accent-color:var(--accent); height:14px; }

  #start { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(560px,92vw);
           background:rgba(12,12,12,.94); border:1px solid var(--accent); padding:22px 24px; text-align:center; }
  #start h1 { margin:0 0 4px; font-size:20px; font-weight:400; letter-spacing:.1em; }
  #start p { margin:0 0 16px; color:var(--dim); font-size:13px; }
  #start .row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  #start button { padding:9px 14px; }
  #start .hint { margin:14px 0 0; }

  #bar { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); width:max-content; max-width:calc(100vw - 24px);
         display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; justify-content:center;
         background:rgba(10,10,10,.92); border:1px solid var(--line); padding:8px 10px; font-size:13px;
         transition:opacity .25s; }
  #bar.hide { opacity:0; pointer-events:none; }
  #bar .sep { width:1px; align-self:stretch; background:var(--line); }
  #bar label { color:var(--dim); display:flex; align-items:center; gap:5px; }
  #seek { width:170px; } #vol { width:70px; } #bpm { width:74px; }
  #clock { color:var(--dim); min-width:92px; text-align:center; }
  #toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#1a0a0e; border:1px solid var(--accent);
           padding:8px 14px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90vw; }
  #toast.show { opacity:1; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="start">
  <h1>-可視化-</h1>
  <p>Pick something to listen to</p>
  <div class="row">
    <button data-act="open">Open audio file</button>
    <button data-act="mic">Microphone</button>
    <button data-act="tab">Tab / system audio</button>
    <button data-act="demo">Play demo beat</button>
  </div>
  <p class="hint">…or drop an audio file anywhere. Drop an image to use it as the cover.</p>
</div>

<div id="bar" class="hide">
  <button data-act="open" title="Open an audio file">Open</button>
  <button data-act="mic" title="Visualize the microphone">Mic</button>
  <button data-act="tab" title="Capture audio from a tab or the whole system">Tab audio</button>
  <button data-act="demo" title="Built-in demo beat">Demo</button>
  <span class="sep"></span>
  <button id="play" title="Play / pause (Space)">▶</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
  <span id="clock">00:00 / --:--</span>
  <label>Vol <input id="vol" type="range" min="0" max="100" value="100"></label>
  <span class="sep"></span>
  <input id="title" type="text" placeholder="Title" aria-label="Title">
  <input id="credit" type="text" placeholder="Credit / album" aria-label="Credit">
  <input id="bpm" type="number" min="40" max="240" placeholder="BPM auto" aria-label="BPM (blank = auto)">
  <span class="sep"></span>
  <select id="size" aria-label="Canvas size">
    <option value="auto">Fit window</option>
    <option value="1920x1080">16:9 · 1920×1080</option>
    <option value="1080x1920">9:16 · 1080×1920</option>
  </select>
  <select id="theme" aria-label="Colour theme">
    <option value="auto">Theme: auto</option>
    <option value="noir">Noir</option>
    <option value="maroon">Maroon</option>
  </select>
  <button id="rec" title="Record the canvas + audio to a video file (R)">● Rec</button>
  <button id="full" title="Fullscreen (F)">Fullscreen</button>
</div>
<div id="toast"></div>
<input id="file" type="file" accept="audio/*,video/*,image/*" multiple hidden>
<audio id="au" preload="auto"></audio>

<script>
'use strict';
/* =====================================================================
   Faux MIDI-player audio visualizer.
   Everything on screen is driven by live FFT analysis of whatever audio
   is playing: the "tracks" are frequency bands, the note names are the
   strongest pitch in each band, the boxed labels follow spectrum peaks.
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pad = (n, w) => String(n).padStart(w, '0');
const f2m = f => 69 + 12 * Math.log2(f / 440);
const m2f = m => 440 * Math.pow(2, (m - 69) / 12);

const FJ = 'DotGothic16,"MS Gothic","Osaka-Mono",monospace';
const FM = 'Consolas,"SF Mono",Menlo,ui-monospace,monospace';

// Japanese (iroha) note names: C=ハ D=ニ E=ホ F=ヘ G=ト A=イ B=ロ
const NOTE_JP = ['ハ','ハ#','ニ','ニ#','ホ','ヘ','ヘ#','ト','ト#','イ','イ#','ロ'];
const KEY_MAJ = ['ハ','変ニ','ニ','変ホ','ホ','ヘ','嬰ヘ','ト','変イ','イ','変ロ','ロ'];
const KEY_MIN = ['ハ','嬰ハ','ニ','嬰ニ','ホ','ヘ','嬰ヘ','ト','嬰ト','イ','変ロ','ロ'];
const PROF_MAJ = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const PROF_MIN = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
function noteName(m) {
  m = Math.round(m);
  const n = NOTE_JP[((m % 12) + 12) % 12], o = Math.floor(m / 12) - 1;
  return n.length > 1 ? n + o : n + '-' + o;
}
const fmtHz = f => f >= 1000 ? (f / 1000).toFixed(1) + 'k Hz' : Math.round(f) + ' Hz';
function fmtClock(t, cs) {
  if (!isFinite(t)) return cs ? '--:--.--' : '--:--';
  t = Math.max(0, t);
  return pad(Math.floor(t / 60), 2) + ':' + pad(Math.floor(t % 60), 2) + (cs ? '.' + pad(Math.floor(t * 100) % 100, 2) : '');
}

const TRACK_NAMES = ['ピアノ','スラップベース1','スラップベース2','エレピ','ストリングス','シンセパッド','ブラス','ファンクギター',
                     'オルガン','*ドラム','オルゴール','テナーサックス','ビブラフォン','フルート','シンセリード','パーカッション'];
const STATIC_TEXT = TRACK_NAMES.join('') + NOTE_JP.join('') + KEY_MAJ.join('') + KEY_MIN.join('') +
  'MIDI再生中一時停止入力時間小節拍テンポトラック形式種類テキスト曲の設定リセットマスター音量パート全部レベルパン表現リバーブコーラスディレイ移調長短可視化音楽±';

const THEMES = {
  noir:   { bg:'#131313', ink:'#dcdcdc', dim:'#6d6d6d', accent:'#a8344d', circ:'#2b2b2b', circW:1,   node:7,  grid:20,
            glyph:'#181818', fill:'rgba(255,255,255,.085)', axis:'#5a5a5a', ghost:'#9a9a9a', box:'rgba(19,19,19,.84)', hi:'#7f9bd8', off:'#333' },
  maroon: { bg:'#110406', ink:'#f4f1f1', dim:'#7b6f72', accent:'#c9577a', circ:'#3b3537', circW:2.6, node:17, grid:34,
            glyph:null,      fill:'rgba(255,236,241,.105)', axis:'#8c8286', ghost:'#9a9093', box:'rgba(24,7,10,.88)',  hi:'#7f9bd8', off:'#3a3033' },
};

/* ---------- state ---------- */
const cv = $('cv'), g = cv.getContext('2d');
const bg = document.createElement('canvas');
const audio = $('au');
const S = {
  src: null, kind: '---', title: '', titleLocked: false, credit: '',
  time: 0, dur: NaN, playing: false, t0: 0,
  bpm: 0, phase: 0, bpmAuto: 0, phaseAuto: 0, bpmManual: 0,
  key: '', keyT: 0, chromaT: 0,
  level: 0, pan: 0, peak: 0, ref: -75, live: false, vol: 1,
  wave: null, cover: null, loadToken: 0, url: null, stream: null, node: null,
  sizeMode: 'auto', themeMode: 'auto',
};
let L = null, TH = THEMES.noir;

/* ---------- audio graph ---------- */
const FFT = 8192;
let ac = null, tap, monitor, an, anT, anL, anR, recDest, mediaNode;
let fd, td, tdL, tdR, binHz = 1, tiltBin, pcBin;
const TILT = 3;                       // dB/octave tilt so highs are readable
function ensureAudio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    tap = ac.createGain();
    monitor = ac.createGain(); monitor.gain.value = S.vol; monitor.connect(ac.destination);
    an = ac.createAnalyser(); an.fftSize = FFT; an.smoothingTimeConstant = 0.55; an.minDecibels = -120;
    anT = ac.createAnalyser(); anT.fftSize = 2048;
    const up = ac.createGain(); up.channelCount = 2; up.channelCountMode = 'explicit'; up.channelInterpretation = 'speakers';
    const split = ac.createChannelSplitter(2);
    anL = ac.createAnalyser(); anR = ac.createAnalyser(); anL.fftSize = anR.fftSize = 1024;
    tap.connect(an); tap.connect(anT); tap.connect(up); up.connect(split); split.connect(anL, 0); split.connect(anR, 1);
    recDest = ac.createMediaStreamDestination(); tap.connect(recDest);
    mediaNode = ac.createMediaElementSource(audio); mediaNode.connect(tap);
    fd = new Float32Array(FFT / 2); td = new Float32Array(2048); tdL = new Float32Array(1024); tdR = new Float32Array(1024);
    binHz = ac.sampleRate / FFT;
    tiltBin = new Float32Array(FFT / 2); pcBin = new Int8Array(FFT / 2);
    for (let i = 1; i < FFT / 2; i++) {
      tiltBin[i] = TILT * Math.log2(i * binHz / 1000);
      pcBin[i] = ((Math.round(f2m(i * binHz)) % 12) + 12) % 12;
    }
  }
  return ac.state === 'suspended' ? ac.resume() : Promise.resolve();
}
let monitorOn = false;
function setMonitor(on) {
  if (on === monitorOn) return;
  monitorOn = on;
  if (on) tap.connect(monitor); else { try { tap.disconnect(monitor); } catch (e) {} }
}

/* ---------- analysis buffers ---------- */
const K = 76, F0 = 35, F1 = 16000;
const STEP = Math.pow(F1 / F0, 1 / (K - 1));
const curveF = new Float32Array(K); for (let k = 0; k < K; k++) curveF[k] = F0 * Math.pow(STEP, k);
const curveDb = new Float32Array(K), vs = new Float32Array(K), prevVs = new Float32Array(K);
const hist = []; let histT = 0;
const tracks = TRACK_NAMES.map((name, i) => ({ name, mc: 30 + i * 4.9, act: 0, on: false, lastOn: -9, midi: 0, pend: 0, pendT: 0, na: 0, onsetT: -9 }));
const slots = [0, 1, 2].map(() => ({ a: 0, strong: false, f: 100, fT: 100, v: 0, vT: 0, name: '', hz: '', txtT: 0 }));
const chroma = new Float32Array(12), tmpC = new Float32Array(12);
const liveEnv = []; let liveBin = 0, liveCur = 0, liveEstT = 0;
const levelHist = new Float32Array(160); let levelHistT = 0;

function resetAnalysis() {
  chroma.fill(0); S.chromaT = 0; S.key = ''; S.keyT = 0;
  S.bpmAuto = 0; S.phaseAuto = 0; applyBpm();
  S.wave = null; liveEnv.length = 0; liveBin = 0; liveCur = 0; liveEstT = 0; levelHist.fill(0);
}
function applyBpm() {
  if (S.bpmManual) { S.bpm = S.bpmManual; S.phase = S.phaseAuto; }
  else { S.bpm = S.bpmAuto; S.phase = S.phaseAuto; }
}

function bandPeak(fLo, fHi) {
  const i0 = Math.max(2, Math.floor(fLo / binHz)), i1 = Math.min(fd.length - 4, Math.ceil(fHi / binHz));
  let bi = i0, bv = -1e9;
  for (let i = i0; i <= i1; i++) { const v = fd[i] + tiltBin[i]; if (v > bv) { bv = v; bi = i; } }
  const a = fd[bi - 1], b = fd[bi], c = fd[bi + 1], den = a - 2 * b + c;
  let off = 0; if (isFinite(den) && den < 0) off = clamp(0.5 * (a - c) / den, -0.5, 0.5);
  return { f: (bi + off) * binHz, db: bv, i: bi };
}

function update(dt, now) {
  // clock
  if (S.src === 'file') { S.time = audio.currentTime; S.dur = audio.duration; S.playing = !audio.paused && !audio.ended; }
  else if (S.src === 'mic' || S.src === 'tab') { S.time = now - S.t0; S.dur = NaN; S.playing = true; }
  else if (S.src === 'demo') { S.time = Math.max(0, ac.currentTime - demo.t0); S.dur = NaN; S.playing = demo.on; }
  else S.playing = false;

  if (!ac) return;
  an.getFloatFrequencyData(fd);
  for (let i = 0; i < fd.length; i++) if (!(fd[i] > -160)) fd[i] = -160;

  // log-spaced display curve
  let maxD = -200;
  for (let k = 0; k < K; k++) {
    const f = curveF[k], b0 = f / Math.sqrt(STEP) / binHz, b1 = f * Math.sqrt(STEP) / binHz;
    let d;
    if (b1 - b0 < 1.5) { const b = f / binHz, i = Math.floor(b), fr = b - i; d = fd[i] * (1 - fr) + fd[i + 1] * fr; }
    else { d = -200; const e = Math.min(fd.length - 1, Math.floor(b1)); for (let i = Math.ceil(b0); i <= e; i++) if (fd[i] > d) d = fd[i]; }
    d += TILT * Math.log2(f / 1000);
    curveDb[k] = d; if (d > maxD) maxD = d;
  }
  S.live = maxD > -92;
  // slow auto-gain so quiet and loud sources both fill the plot
  if (maxD > S.ref) S.ref += (maxD - S.ref) * (1 - Math.exp(-dt / 0.05)); else S.ref -= 3 * dt;
  S.ref = Math.max(S.ref, -72);
  const bottom = S.ref - 50, span = 58;
  const kUp = 1 - Math.exp(-dt / 0.016), kDown = 1 - Math.exp(-dt / 0.05);
  let flux = 0;
  for (let k = 0; k < K; k++) {
    const v = clamp((curveDb[k] - bottom) / span, 0, 1);
    prevVs[k] = vs[k];
    vs[k] += (v - vs[k]) * (v > vs[k] ? kUp : kDown);
    if (vs[k] < 0.002) vs[k] = 0;
    flux += Math.max(0, vs[k] - prevVs[k]);
  }
  // ghost-trail snapshots
  histT += dt;
  if (histT > 0.055) { histT = 0; hist.unshift(Float32Array.from(vs)); if (hist.length > 7) hist.pop(); }

  // level / pan
  anT.getFloatTimeDomainData(td);
  let ss = 0, pk = 0; for (let i = 0; i < td.length; i++) { const v = td[i]; ss += v * v; const a = v < 0 ? -v : v; if (a > pk) pk = a; }
  const db = 20 * Math.log10(Math.sqrt(ss / td.length) + 1e-9);
  const ease = 1 - Math.exp(-dt / 0.08);
  S.level += (clamp((db + 50) / 44, 0, 1) * 127 - S.level) * ease;
  S.peak = Math.max(pk, S.peak * Math.exp(-dt / 0.5));
  anL.getFloatTimeDomainData(tdL); anR.getFloatTimeDomainData(tdR);
  let sl = 0, sr = 0; for (let i = 0; i < tdL.length; i++) { sl += tdL[i] * tdL[i]; sr += tdR[i] * tdR[i]; }
  sl = Math.sqrt(sl); sr = Math.sqrt(sr);
  S.pan += ((sl + sr > 1e-4 ? (sr - sl) / (sr + sl) * 63 : 0) - S.pan) * (1 - Math.exp(-dt / 0.25));
  levelHistT += dt;
  if (levelHistT > 0.1 && S.playing) { levelHistT = 0; levelHist.copyWithin(0, 1); levelHist[levelHist.length - 1] = clamp(S.peak, 0, 1); }

  updateTracks(dt, now);
  updatePeaks(dt, now);
  updateChroma(dt, now);
  if (S.src === 'mic' || S.src === 'tab') updateLiveTempo(flux, now);
}

function updateTracks(dt, now) {
  const kAct = 1 - Math.exp(-dt / 0.06);
  for (const t of tracks) {
    const p = bandPeak(m2f(t.mc - 3.2), m2f(t.mc + 3.2)), i = p.i;
    const tonal = fd[i] - Math.max(fd[i - 3], fd[i + 3]) > 3;
    const crit = S.live && tonal && p.db > S.ref - 30;
    t.act += ((crit ? 1 : 0) - t.act) * kAct;
    const was = t.on;
    if (!t.on && t.act > 0.62) { t.on = true; t.onsetT = now; } else if (t.on && t.act < 0.3) t.on = false;
    if (t.on) t.lastOn = now;
    if (crit) {
      const m = Math.round(f2m(p.f));
      if ((!was && t.on) || t.na < 0.05) { t.midi = m; t.pend = m; }
      else if (m !== t.midi) {
        if (m !== t.pend) { t.pend = m; t.pendT = now; }
        else if (now - t.pendT > 0.08) { t.midi = m; t.onsetT = now; }
      } else t.pend = m;
    }
    t.na = t.on ? Math.min(1, t.na + dt * 12) : t.na * Math.exp(-dt / 0.8);
  }
}

function updatePeaks(dt, now) {
  const c = [];
  for (let k = 1; k < K - 1; k++) {
    const v = vs[k]; if (v < 0.14 || v < vs[k - 1] || v < vs[k + 1]) continue;
    let l = v, r = v;
    for (let j = 1; j <= 6; j++) { if (k - j >= 0 && vs[k - j] < l) l = vs[k - j]; if (k + j < K && vs[k + j] < r) r = vs[k + j]; }
    const prom = v - Math.max(l, r); if (prom < 0.025) continue;
    c.push({ k, v, score: v + prom * 2 });
  }
  c.sort((a, b) => b.score - a.score);
  // keep picked peaks at least one label-box apart so the boxes never collide
  const minSep = Math.max(8, Math.ceil(L.lab.w * 1.08 / ((L.plot.x1 - L.plot.x0) / (K - 1)))), pick = [];
  for (const p of c) { if (pick.every(q => Math.abs(q.k - p.k) >= minSep)) { pick.push(p); if (pick.length === 3) break; } }
  for (const p of pick) { p.f = curveF[p.k]; p.fx = bandPeak(p.f / STEP, p.f * STEP).f; }
  const used = new Set();
  for (const s of slots) {
    s.strong = false; if (s.a < 0.02) continue;
    let best = null, bd = 0.5;
    for (const p of pick) { if (used.has(p)) continue; const d = Math.abs(Math.log2(p.f / s.fT)); if (d < bd) { bd = d; best = p; } }
    if (best) { used.add(best); s.strong = true; s.fT = best.f; s.vT = best.v; s.fx = best.fx; }
  }
  for (const p of pick) {
    if (used.has(p)) continue;
    const s = slots.find(s => s.a < 0.02 && !s.strong); if (!s) break;
    s.strong = true; s.f = s.fT = p.f; s.v = s.vT = p.v; s.fx = p.fx; s.txtT = 0;
  }
  const r = 1 - Math.exp(-dt / 0.045);
  for (const s of slots) {
    if (s.strong) {
      s.f *= Math.pow(s.fT / s.f, r); s.v += (s.vT - s.v) * r; s.a = Math.min(1, s.a + dt * 10);
      if (now - s.txtT > 0.09) { s.txtT = now; s.name = noteName(f2m(s.fx)); s.hz = fmtHz(s.fx); }
    } else s.a = Math.max(0, s.a - dt * 1.7);
  }
}

function updateChroma(dt, now) {
  if (!S.live || !S.playing) return;
  const i0 = Math.ceil(65 / binHz), i1 = Math.floor(2100 / binHz);
  tmpC.fill(0); let sum = 0;
  for (let i = i0; i <= i1; i++) {
    const d = fd[i]; if (d < fd[i - 1] || d < fd[i + 1]) continue;
    const a = Math.pow(10, d / 20); tmpC[pcBin[i]] += a; sum += a;
  }
  if (sum <= 0) return;
  const k = 1 - Math.exp(-dt / 12);
  for (let p = 0; p < 12; p++) chroma[p] += (tmpC[p] / sum - chroma[p]) * k;
  S.chromaT += dt;
  if (now - S.keyT > 1 && S.chromaT > 4) { S.keyT = now; S.key = estimateKey(); }
}
function estimateKey() {
  let best = '', bs = -2;
  const corr = (prof, rot) => {
    let mx = 0, my = 0; for (let i = 0; i < 12; i++) { mx += chroma[i]; my += prof[i]; } mx /= 12; my /= 12;
    let n = 0, dx = 0, dy = 0;
    for (let i = 0; i < 12; i++) { const x = chroma[(i + rot) % 12] - mx, y = prof[i] - my; n += x * y; dx += x * x; dy += y * y; }
    return n / Math.sqrt(dx * dy + 1e-12);
  };
  for (let r = 0; r < 12; r++) {
    const a = corr(PROF_MAJ, r), b = corr(PROF_MIN, r);
    if (a > bs) { bs = a; best = KEY_MAJ[r] + '長調'; }
    if (b > bs) { bs = b; best = KEY_MIN[r] + '短調'; }
  }
  return best;
}

/* ---------- tempo ---------- */
function estimateTempo(o, fr) {
  const n = o.length; let mean = 0; for (let i = 0; i < n; i++) mean += o[i]; mean /= n;
  const x = new Float32Array(n); for (let i = 0; i < n; i++) x[i] = o[i] - mean;
  const maxLag = Math.min(n - 2, Math.ceil(fr * 4) + 2), acf = new Float32Array(maxLag + 2);
  for (let l = 0; l <= maxLag; l++) { let s = 0; for (let i = 0; i < n - l; i++) s += x[i] * x[i + l]; acf[l] = s / (n - l); }

    osc('sawtooth', f, t, 0.45, lp); osc('sine', f, t, 0.45, lp);
  }
  if (s === 0 || s === 10) ch.n.forEach((n, i) => { const e = env(t + i * 0.012, s ? 0.07 : 0.11, 1.5, 0.01); osc('sine', m2f(n), t, 1.6, e, (i - 2) * 0.25); osc('sine', m2f(n) * 2.005, t, 0.5, env(t, 0.018, 0.4), (i - 2) * 0.25); });
  if (r() < 0.3) { const n = DEMO_LEAD[Math.floor(r() * DEMO_LEAD.length)]; osc('triangle', m2f(n), t, 0.45, env(t, 0.1, 0.45), r() - 0.5); }
}

/* ---------- recording ---------- */
let rec = null, chunks = [];
function toggleRec() {
  if (rec) { rec.stop(); return; }
  if (!window.MediaRecorder) { toast('Recording is not supported in this browser.'); return; }
  const tr = [...cv.captureStream(60).getVideoTracks()];
  if (recDest) tr.push(...recDest.stream.getAudioTracks());
  const mime = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  rec = new MediaRecorder(new MediaStream(tr), { mimeType: mime, videoBitsPerSecond: 12e6 }); chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: mime }));
    a.download = (S.title || 'visualizer') + (mime.includes('mp4') ? '.mp4' : '.webm'); a.click();
    rec = null; $('rec').classList.remove('on'); $('rec').textContent = '● Rec';
  };
  rec.start(1000); $('rec').classList.add('on'); $('rec').textContent = '■ Stop';
}

/* ---------- UI ---------- */
let hideT = 0;
function wake() {
  $('bar').classList.remove('hide'); clearTimeout(hideT);
  hideT = setTimeout(() => { if (S.src && !$('bar').matches(':hover') && !$('bar').contains(document.activeElement)) $('bar').classList.add('hide'); }, 2600);
}
function act(a) {
  if (a === 'open') $('file').click();
  else if (a === 'mic') startStream('mic');
  else if (a === 'tab') startStream('tab');
  else if (a === 'demo') startDemo();
}
function togglePlay() {
  if (S.src === 'file') { ensureAudio(); if (audio.paused) audio.play(); else audio.pause(); }
  else if (S.src === 'demo') { if (demo.on) stopDemo(); else startDemo(); }
}
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act)));
$('file').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
$('play').addEventListener('click', togglePlay);
let seeking = false;
$('seek').addEventListener('input', e => { seeking = true; if (S.src === 'file' && isFinite(audio.duration)) audio.currentTime = e.target.value / 1000 * audio.duration; });
$('seek').addEventListener('change', () => { seeking = false; });
$('vol').addEventListener('input', e => { S.vol = e.target.value / 100; if (monitor) monitor.gain.value = S.vol; });
$('title').addEventListener('input', e => { S.titleLocked = !!e.target.value; S.title = e.target.value; loadGlyphs(S.title); });
$('credit').addEventListener('input', e => { S.credit = e.target.value; loadGlyphs(S.credit); });
$('bpm').addEventListener('input', e => { const v = parseFloat(e.target.value); S.bpmManual = v >= 40 && v <= 240 ? v : 0; applyBpm(); });
$('size').addEventListener('change', e => { S.sizeMode = e.target.value; resize(); });
$('theme').addEventListener('change', e => { S.themeMode = e.target.value; resize(); });
$('rec').addEventListener('click', toggleRec);
$('full').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
addEventListener('mousemove', wake); addEventListener('touchstart', wake, { passive: true });
addEventListener('resize', resize);
addEventListener('keydown', e => {
  if (/INPUT|SELECT/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'f' || e.key === 'F') $('full').click();
  else if (e.key === 'r' || e.key === 'R') toggleRec();
  else if (e.key === 'ArrowRight' && S.src === 'file') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  else if (e.key === 'ArrowLeft' && S.src === 'file') audio.currentTime = Math.max(0, audio.currentTime - 5);
});
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
addEventListener('dragleave', () => document.body.classList.remove('drag'));
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
cv.addEventListener('click', e => {              // click the waveform strip (portrait) to seek
  if (!L.portrait || S.src !== 'file' || !isFinite(audio.duration)) return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * L.Wd, y = (e.clientY - r.top) / r.height * L.Hd, st = L.strip;
  if (Math.abs(y - st.y) < st.h && x >= st.x0 && x <= st.x1) audio.currentTime = (x - st.x0) / (st.x1 - st.x0) * audio.duration;
});

/* ---------- main loop ---------- */
let lastT = performance.now();
function frame(nowMs) {
  const dt = clamp((nowMs - lastT) / 1000, 0.001, 0.1), now = nowMs / 1000; lastT = nowMs;
  update(dt, now); draw(now);
  $('play').textContent = S.playing ? '❚❚' : '▶';
  $('clock').textContent = fmtClock(S.time) + ' / ' + fmtClock(S.dur);
  if (!seeking && S.src === 'file' && isFinite(S.dur) && S.dur > 0) $('seek').value = S.time / S.dur * 1000;
  requestAnimationFrame(frame);
}
resize(); wake();
loadGlyphs(STATIC_TEXT);
requestAnimationFrame(frame);
window.viz = { S, tracks, slots, demo, vs, startDemo, stopSource };
</script>
</body>
